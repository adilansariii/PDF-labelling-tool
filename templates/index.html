<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freespace PDF Labelling Tool</title>


<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>


</head>
<body>

<div class="container">


<div class="header">
    <h1>Freespace PDF Labelling Tool</h1>
    <p>Upload, reorder and label PDFs before merging.</p>
</div>

<form id="pdfForm" method="POST" enctype="multipart/form-data">

    <div class="card">
        <label class="label-title">Upload PDFs</label>

        <input
            type="file"
            id="pdfInput"
            name="pdfs"
            multiple
            accept=".pdf"
            required
        >
    </div>

    <div class="card">

        <div class="settings-grid">

            <div>
                <label>Position</label>

                <select id="position" name="position">
                    <option value="top-left">Top Left</option>
                    <option value="top-right">Top Right</option>
                    <option value="bottom-left">Bottom Left</option>
                    <option value="bottom-right">Bottom Right</option>
                    <option value="center">Center</option>
                </select>
            </div>

            <div>
                <label>Font Size</label>

                <input
                    type="number"
                    id="font_size"
                    name="font_size"
                    min="8"
                    max="60"
                    value="20"
                >
            </div>

            <div>
                <label>Opacity</label>

                <input
                    type="range"
                    id="opacity"
                    name="opacity"
                    min="0.1"
                    max="1"
                    step="0.1"
                    value="0.4"
                >

                <span id="opacityValue">0.4</span>
            </div>

        </div>

    </div>

    <div class="card">

        <h2>PDF Order</h2>

        <ul id="fileList"></ul>

    </div>

    <div class="card">

        <h2>Label Preview</h2>

        <table id="previewTable">

            <thead>
                <tr>
                    <th>File Name</th>
                    <th>Label</th>
                </tr>
            </thead>

            <tbody></tbody>

        </table>

    </div>

    <input
        type="hidden"
        id="file_order"
        name="file_order"
    >

    <button type="submit" class="generate-btn">
        Generate Labelled PDF
    </button>

</form>
```




<script>

let uploadedFiles = [];

const pdfInput = document.getElementById("pdfInput");
const fileList = document.getElementById("fileList");
const previewBody = document.querySelector("#previewTable tbody");

const opacitySlider = document.getElementById("opacity");
const opacityValue = document.getElementById("opacityValue");

opacitySlider.addEventListener("input", () => {
    opacityValue.textContent = opacitySlider.value;
});

function cleanLabel(filename) {

    let label = filename.replace(".pdf", "");

    label = label.replace(/[_-]/g, " ");

    label = label.replace(/final|copy|v\d+/gi, "");

    label = label.replace(/\s+/g, " ").trim();

    return label;
}

function rebuildPreview() {

    previewBody.innerHTML = "";

    document.querySelectorAll(".file-item")
        .forEach(item => {

            const filename = item.dataset.filename;

            const labelInput =
                item.querySelector(".label-input");

            const row =
                document.createElement("tr");

            row.innerHTML = `
                <td>${filename}</td>
                <td>${labelInput.value}</td>
            `;

            previewBody.appendChild(row);
        });
}

function updateOrderField() {

    const orderData = [];

    document.querySelectorAll(".file-item")
        .forEach(item => {

            orderData.push({
                index: parseInt(item.dataset.index),
                label: item.querySelector(".label-input").value
            });

        });

    document.getElementById("file_order").value =
        JSON.stringify(orderData);
}


pdfInput.addEventListener("change", () => {

    uploadedFiles = Array.from(pdfInput.files);

    fileList.innerHTML = "";

    previewBody.innerHTML = "";

    uploadedFiles.forEach((file, index) => {

        const li = document.createElement("li");

        li.className = "file-item";

        li.dataset.filename = file.name;

        li.dataset.index = index;

        li.innerHTML = `
            <span class="drag-handle">☰</span>

            <span class="file-name">
                ${file.name}
            </span>

            <input
                class="label-input"
                type="text"
                name="labels"
                value="${cleanLabel(file.name)}"
            >
        `;

        fileList.appendChild(li);

        li.querySelector(".label-input")
            .addEventListener(
                "input",
                rebuildPreview
            );
    });

    rebuildPreview();

    updateOrderField();
});

new Sortable(fileList, {

    animation: 150,

    ghostClass: "sortable-ghost",

    chosenClass: "sortable-chosen",

    dragClass: "sortable-drag",

    onEnd: () => {

        rebuildPreview();

        updateOrderField();
    }
});

document.getElementById("pdfForm")
.addEventListener("submit", () => {

    updateOrderField();
});

const savedPosition =
    localStorage.getItem("position");

const savedFontSize =
    localStorage.getItem("font_size");

const savedOpacity =
    localStorage.getItem("opacity");

if(savedPosition){
    document.getElementById("position").value =
        savedPosition;
}

if(savedFontSize){
    document.getElementById("font_size").value =
        savedFontSize;
}

if(savedOpacity){

    document.getElementById("opacity").value =
        savedOpacity;

    opacityValue.textContent =
        savedOpacity;
}

document.getElementById("position")
.addEventListener("change", e => {

    localStorage.setItem(
        "position",
        e.target.value
    );
});

document.getElementById("font_size")
.addEventListener("change", e => {

    localStorage.setItem(
        "font_size",
        e.target.value
    );
});

document.getElementById("opacity")
.addEventListener("change", e => {

    localStorage.setItem(
        "opacity",
        e.target.value
    );
});

</script>

</body>
</html>
